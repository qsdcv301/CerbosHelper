plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'com.github.qsdcv301'
version = '1.0.13'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    api 'org.mybatis:mybatis:3.5.17'
    implementation 'dev.cerbos:cerbos-sdk-java:0.18.0'
    implementation 'io.grpc:grpc-core:1.79.0'
    implementation 'com.google.protobuf:protobuf-java-util:4.33.5'
    implementation 'org.springframework.boot:spring-boot-autoconfigure:3.3.6'
    implementation 'org.springframework:spring-aop:6.1.15'
    implementation 'org.springframework:spring-context:6.1.15'
    implementation 'org.springframework:spring-expression:6.1.15'
    implementation 'org.aspectj:aspectjweaver:1.9.22.1'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.3'
    implementation 'org.slf4j:slf4j-api:2.0.16'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs.add('-parameters')
}

tasks.named('test') {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
            groupId = 'com.github.qsdcv301'
            artifactId = project.name
            version = project.version
        }
    }
}
